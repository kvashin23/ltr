<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Статьи салона красоты LTRstyle – советы и рекомендации</title>
<meta name="description" content="Статьи стилистов студии LTRstyle: окрашивание, стрижки, укладки и уход за волосами. Практичные советы от мастеров салона в Москве.">
<link rel="canonical" href="https://ltrstyle.ru/articles/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet">
<style>
{{COMMON_CSS}}

/* ================= СТРАНИЦА «СТАТЬИ» ================= */
.kicker{font-family:var(--sans);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:0 0 18px}

/* ---------- 1. Вступление ---------- */
.intro{border-top:1px solid var(--border);padding:64px 0 56px}
.intro__title{font-family:var(--serif);font-weight:400;font-size:clamp(44px,6vw,84px);line-height:.96;letter-spacing:-.01em;margin:0}
@media (max-width:991px){.intro{padding:40px 0 32px}}

/* ---------- 2. Новая статья ---------- */
.top{padding:0 0 100px}
.feat{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--cream);text-decoration:none;min-height:500px}
.feat__pic{position:relative;overflow:hidden;background:#e9e7e3}
.feat__pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 25%;transition:transform .7s ease}
.feat:hover .feat__pic img{transform:scale(1.04)}
.feat__new{position:absolute;left:18px;top:18px;background:var(--navy);color:#fff;font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;padding:9px 12px;border-radius:999px}
.feat__body{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:56px 64px}
.feat__cat{font-family:var(--sans);font-size:13px;color:var(--text-2);margin:0 0 18px}
.feat__title{font-family:var(--serif);font-weight:400;font-size:clamp(28px,3vw,44px);line-height:1.08;margin:0 0 20px}
.feat__ex{font-size:18px;line-height:1.55;color:var(--text-2);margin:0 0 36px;max-width:46ch}
.feat:hover .btn--navy{background:#1b2244}
@media (max-width:991px){.feat__body{padding:36px 32px}}
@media (max-width:782px){
  .top{padding-bottom:64px}
  .feat{grid-template-columns:1fr;min-height:0;background:#fff}
  .feat__pic{aspect-ratio:4/3.6;margin:0 calc(var(--gut)*-1)}
  .feat__body{padding:26px 0 0}
  .feat__ex{font-size:17px;margin-bottom:28px}
}

/* ---------- 3. Все статьи: фильтры + сетка ---------- */
.list{padding:0 0 110px}
.list__head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}
.list__found{font-family:var(--sans);font-size:14px;color:var(--muted);margin:0}
.bar{position:sticky;top:0;z-index:15;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:44px}
.bar__in{display:flex;align-items:center;gap:16px;min-height:76px}
.chips{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border:1px solid var(--border);border-radius:999px;background:#fff;font-family:var(--sans);font-size:14px;cursor:pointer;transition:border-color .15s,background .15s,color .15s}
.chip small{font-size:12px;color:var(--muted);transition:color .15s}
.chip:hover{border-color:var(--navy)}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip[aria-pressed=true] small{color:rgba(255,255,255,.6)}
.search{position:relative;flex:0 1 300px}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:1.6}
.search input{width:100%;height:42px;border:1px solid var(--border);border-radius:999px;padding:0 40px 0 44px;font-family:var(--sans);font-size:14px;background:#fff;outline:none;transition:border-color .15s}
.search input:focus{border-color:var(--navy)}
.search input::-webkit-search-cancel-button{display:none}
.search__x{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;border-radius:50%;background:var(--soft);cursor:pointer;display:none;place-items:center;font-size:16px;line-height:1;color:var(--text-2)}
.search.has-q .search__x{display:grid}
.sort{position:relative}
.sort select{appearance:none;-webkit-appearance:none;height:42px;border:1px solid var(--border);border-radius:999px;padding:0 40px 0 18px;font-family:var(--sans);font-size:14px;background:#fff;cursor:pointer;outline:none}
.sort select:focus{border-color:var(--navy)}
.sort::after{content:"";position:absolute;right:18px;top:50%;width:7px;height:7px;border-right:1.5px solid var(--text);border-bottom:1.5px solid var(--text);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:56px 24px}
.grid .acard.is-hidden{display:none}
.grid .acard{animation:fadeUp .45s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.empty{display:none;text-align:center;padding:60px 20px;border:1px dashed var(--border)}
.empty.is-on{display:block}
.empty p{margin:0 0 20px;font-size:20px}
.more{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:64px}
.more[hidden]{display:none}
.more__bar{width:220px;height:2px;background:var(--border);position:relative;overflow:hidden}
.more__bar i{position:absolute;left:0;top:0;bottom:0;background:var(--gold);transition:width .3s}
.more__txt{font-family:var(--sans);font-size:13px;color:var(--muted);margin:0}
mark{background:rgba(186,168,134,.35);color:inherit;padding:0 1px}
@media (max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:991px){
  .bar__in{flex-wrap:wrap;gap:10px;padding-top:12px;padding-bottom:12px;min-height:0}
  .chips{order:2;flex:0 0 calc(100% + var(--gut)*2);min-width:0;margin:0 calc(var(--gut)*-1);padding:0 var(--gut)}
  .search{flex:1 1 0;min-width:0}
  .bar{margin-bottom:32px}
}
@media (max-width:782px){
  .list{padding-bottom:64px}
  .list__head{flex-direction:column;align-items:flex-start;gap:8px}
  .grid{gap:40px 14px}
}
@media (max-width:600px){
  .grid{grid-template-columns:1fr;gap:40px}
  .sort select{padding-right:34px;padding-left:14px}
}
</style>
</head>
<body>

{{HEADER}}

<div class="wrap crumbs">
  <ol>
    <li><a href="https://ltrstyle.ru/">Главная</a></li>
    <li><span aria-current="page">Статьи</span></li>
  </ol>
</div>

<main>

<!-- ============ 1. ВСТУПЛЕНИЕ ============ -->
<section class="intro">
  <div class="wrap">
    <p class="kicker">Журнал студии LTRstyle</p>
    <h1 class="intro__title">Статьи о&nbsp;волосах</h1>
  </div>
</section>

<!-- ============ 2. НОВАЯ СТАТЬЯ ============ -->
<section class="top" aria-label="Новая статья">
  <div class="wrap">
    <a class="feat" href="{{F_URL}}">
      <div class="feat__pic"><img src="{{F_IMG}}" alt="" fetchpriority="high"><span class="feat__new">Новая статья</span></div>
      <div class="feat__body">
        <p class="feat__cat">{{F_CAT}}</p>
        <h2 class="feat__title">{{F_TITLE}}</h2>
        <p class="feat__ex">{{F_EX}}…</p>
        <span class="btn btn--navy">Читать статью</span>
      </div>
    </a>
  </div>
</section>

<!-- ============ 3. ВСЕ СТАТЬИ ============ -->
<section class="list" aria-labelledby="list-t" id="all">
  <div class="wrap list__head">
    <h2 class="h2" id="list-t">Все статьи</h2>
    <p class="list__found" id="found" aria-live="polite"></p>
  </div>

  <div class="bar">
    <div class="wrap bar__in">
      <div class="chips" role="group" aria-label="Темы">
        <button class="chip" type="button" data-cat="" aria-pressed="true">Все <small>{{N_ALL}}</small></button>
        <button class="chip" type="button" data-cat="c" aria-pressed="false">Окрашивание <small>{{N_C}}</small></button>
        <button class="chip" type="button" data-cat="h" aria-pressed="false">Стрижки и укладки <small>{{N_H}}</small></button>
        <button class="chip" type="button" data-cat="u" aria-pressed="false">Уход <small>{{N_U}}</small></button>
      </div>
      <label class="search" id="searchBox">
        <span class="sr">Поиск по статьям</span>
        <svg viewBox="0 0 18 18" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="m12.5 12.5 4 4"/></svg>
        <input type="search" id="q" placeholder="Поиск: балаяж, седина, чёлка…" autocomplete="off">
        <button class="search__x" type="button" id="qx" aria-label="Очистить поиск">×</button>
      </label>
      <label class="sort">
        <span class="sr">Сортировка</span>
        <select id="sort">
          <option value="new">Сначала новые</option>
          <option value="pop">Популярные</option>
        </select>
      </label>
    </div>
  </div>

  <div class="wrap">
    <div class="grid" id="grid">
{{CARDS}}
    </div>
    <div class="empty" id="empty">
      <p>Ничего не нашлось. Попробуйте другой запрос или&nbsp;тему.</p>
      <button class="btn btn--ghost" type="button" id="reset">Показать все статьи</button>
    </div>
    <div class="more" id="more">
      <button class="btn btn--ghost" type="button" id="moreBtn">Показать ещё</button>
      <div class="more__bar" aria-hidden="true"><i id="moreBar"></i></div>
      <p class="more__txt" id="moreTxt"></p>
    </div>
  </div>
</section>

{{FOOTER}}

<script>
(function(){
  var PAGE=9;
  var grid=document.getElementById('grid'),cards=[].slice.call(grid.children);
  var chips=[].slice.call(document.querySelectorAll('.chip')),q=document.getElementById('q'),qx=document.getElementById('qx'),box=document.getElementById('searchBox');
  var sort=document.getElementById('sort'),found=document.getElementById('found'),empty=document.getElementById('empty');
  var more=document.getElementById('more'),moreBtn=document.getElementById('moreBtn'),moreBar=document.getElementById('moreBar'),moreTxt=document.getElementById('moreTxt');
  var st={cat:'',q:'',sort:'new',shown:PAGE};

  // исходные тексты для подсветки найденного
  cards.forEach(function(c){
    c._t=c.querySelector('.acard__title');c._e=c.querySelector('.acard__ex');
    c._tt=c._t.textContent;c._et=c._e.textContent;
    c._s=norm(c._tt+' '+c._et+' '+c.querySelector('.acard__cat').textContent);
  });
  function norm(s){return s.toLowerCase().replace(/ё/g,'е')}
  function esc(s){return s.replace(/[&<>"]/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]})}
  function hl(text,words){
    if(!words.length)return esc(text);
    var n=norm(text),marks=[];
    words.forEach(function(w){var i=0;while((i=n.indexOf(w,i))>-1){marks.push([i,i+w.length]);i+=w.length}});
    if(!marks.length)return esc(text);
    marks.sort(function(a,b){return a[0]-b[0]});
    var out='',pos=0;marks.forEach(function(m){if(m[0]<pos)return;out+=esc(text.slice(pos,m[0]))+'<mark>'+esc(text.slice(m[0],m[1]))+'</mark>';pos=m[1]});
    return out+esc(text.slice(pos));
  }
  function plural(n,a,b,c){var m=n%100,d=n%10;if(m>10&&m<15)return c;if(d===1)return a;if(d>1&&d<5)return b;return c}

  function render(animate){
    var words=norm(st.q).split(/\s+/).filter(Boolean);
    var list=cards.filter(function(c){
      if(st.cat&&c.dataset.cat!==st.cat)return false;
      return words.every(function(w){return c._s.indexOf(w)>-1});
    });
    list.sort(function(a,b){
      if(st.sort==='pop')return b.dataset.views-a.dataset.views;
      return a.dataset.i-b.dataset.i;
    });
    cards.forEach(function(c){c.classList.add('is-hidden')});
    list.forEach(function(c,i){
      grid.appendChild(c);
      c._t.innerHTML=hl(c._tt,words);c._e.innerHTML=hl(c._et,words);
      if(i<st.shown){
        var was=c.classList.contains('is-hidden');
        c.classList.remove('is-hidden');
        c.style.animationDelay=animate&&was?Math.min(i%PAGE,8)*40+'ms':'0ms';
        if(!animate)c.style.animation='none';else c.style.animation='';
      }
    });
    var shown=Math.min(st.shown,list.length);
    found.textContent=(st.q||st.cat)?'Найдено: '+list.length+' '+plural(list.length,'статья','статьи','статей'):list.length+' '+plural(list.length,'статья','статьи','статей');
    empty.classList.toggle('is-on',!list.length);
    more.hidden=shown>=list.length;
    var left=list.length-shown;
    moreBtn.textContent='Показать ещё '+Math.min(PAGE,left);
    moreTxt.textContent='Вы посмотрели '+shown+' из '+list.length;
    moreBar.style.width=(list.length?shown/list.length*100:0)+'%';
    syncUrl();
  }
  function syncUrl(){
    try{
      var p=new URLSearchParams();
      if(st.cat)p.set('tema',st.cat);if(st.q)p.set('q',st.q);if(st.sort!=='new')p.set('sort',st.sort);
      var s=p.toString();history.replaceState(null,'',location.pathname+(s?'?'+s:'')+location.hash);
    }catch(_){}
  }
  function setCat(cat){
    st.cat=cat;st.shown=PAGE;
    chips.forEach(function(ch){ch.setAttribute('aria-pressed',ch.dataset.cat===cat)});
  }

  chips.forEach(function(ch){ch.addEventListener('click',function(){setCat(ch.dataset.cat);render(true)})});
  var t;q.addEventListener('input',function(){
    box.classList.toggle('has-q',!!q.value);
    clearTimeout(t);t=setTimeout(function(){st.q=q.value.trim();st.shown=PAGE;render(true)},120);
  });
  qx.addEventListener('click',function(){q.value='';box.classList.remove('has-q');st.q='';st.shown=PAGE;render(true);q.focus()});
  sort.addEventListener('change',function(){st.sort=sort.value;st.shown=PAGE;render(true)});
  moreBtn.addEventListener('click',function(){st.shown+=PAGE;render(true)});
  document.getElementById('reset').addEventListener('click',function(){q.value='';box.classList.remove('has-q');st.q='';setCat('');st.shown=PAGE;render(true)});

  // состояние из адреса: ?tema=c&q=балаяж&sort=pop
  try{
    var p=new URLSearchParams(location.search);
    if(p.get('tema'))setCat(p.get('tema'));
    if(p.get('q')){q.value=p.get('q');st.q=q.value;box.classList.add('has-q')}
    if(p.get('sort')){st.sort=p.get('sort');sort.value=st.sort}
  }catch(_){}
  render(false);
})();
</script>
</body>
</html>
